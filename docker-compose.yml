services:

  # The database — stores all patients, cases, medications etc.
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: caredev
      POSTGRES_PASSWORD: caredev
      POSTGRES_DB: remotecare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caredev -d remotecare"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The real backend — FastAPI
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "DATABASE_URL=$$MIGRATION_DATABASE_URL alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Mock server — OpenAPI contract testing
  mock:
    image: stoplight/prism:4
    command: mock -h 0.0.0.0 -p 8001 /tmp/openapi.yaml
    volumes:
      - ./mock/openapi.yaml:/tmp/openapi.yaml
    ports:
      - "8001:8001"


volumes:
  pgdata:
