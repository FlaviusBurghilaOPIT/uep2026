version: "3.9"

services:

  # The database — stores all patients, cases, medications etc.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: caredev
      POSTGRES_PASSWORD: caredev
      POSTGRES_DB: remotecare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caredev -d remotecare"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  # The real backend — P5 builds this (FastAPI)
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # The mock server — fake backend, ready immediately
  # P2, P3, P4 use this while P5 builds the real thing
  mock:
    image: stoplight/prism:4
    command: mock -h 0.0.0.0 -p 8001 /tmp/openapi.yaml
    volumes:
      - ./mock/openapi.yaml:/tmp/openapi.yaml
    ports:
      - "8001:8001"

  # The React web app — clinician dashboard
  web:
    build: ./web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
    environment:
      VITE_API_URL: http://localhost:8001

volumes:
  pgdata:
