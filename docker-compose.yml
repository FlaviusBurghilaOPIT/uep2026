services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caredev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caredev}
      POSTGRES_DB: ${POSTGRES_DB:-remotecare}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-caredev} -d ${POSTGRES_DB:-remotecare}",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_PORT: 6006
      PHOENIX_GRPC_PORT: 4317
      PHOENIX_HOST: 0.0.0.0
      PHOENIX_ENABLE_AUTH: ${PHOENIX_ENABLE_AUTH:-true}
      PHOENIX_SECRET: ${PHOENIX_SECRET:-dev-phoenix-secret-key-32chars-min}
      PHOENIX_SECRET_KEY: ${PHOENIX_SECRET:-dev-phoenix-secret-key-32chars-min}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD:-Phoenix#2026!Guard}
      PHOENIX_ENABLE_STRONG_PASSWORD_POLICY: "false"
      PHOENIX_POSTGRES_HOST: db
      PHOENIX_POSTGRES_PORT: 5432
      PHOENIX_POSTGRES_USER: ${POSTGRES_USER:-caredev}
      PHOENIX_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caredev}
      PHOENIX_POSTGRES_DB: ${POSTGRES_DB:-remotecare}
      PHOENIX_SQL_DATABASE_SCHEMA: phoenix
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://caredev:caredev@db:5432/remotecare}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-dev-only-change-in-prod}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-use-strong-secret-key-32chars}
      CLINICIAN_EMAIL: ${CLINICIAN_EMAIL:-clinician@example.com}
      CLINICIAN_PASSWORD: ${CLINICIAN_PASSWORD:-CarePro#2026!Secure}
      DEMO_PATIENT_EMAIL: ${DEMO_PATIENT_EMAIL:-patient@example.com}
      PHOENIX_ADMIN_EMAIL: ${PHOENIX_ADMIN_EMAIL:-admin@localhost}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD:-Phoenix#2026!Guard}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3-8b-instruct}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-20}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-ada-002}
      FDA_PROVIDER: ${FDA_PROVIDER:-live}
      FDA_TIMEOUT: ${FDA_TIMEOUT:-8}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-remote-carepro}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
      phoenix:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - web
    restart: unless-stopped

volumes:
  pgdata:
    name: remotecare-pgdata
  phoenix_data:
    name: remotecare-phoenix-data
