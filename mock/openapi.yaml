openapi: 3.0.3
info:
  title: Remote CarePro API
  version: 1.0.0
  description: API contract for the Remote CarePro platform. This is the source of truth for all frontend and backend development.

servers:
  - url: http://localhost:8001
    description: Mock server (Prism)
  - url: http://localhost:8000
    description: Local backend (FastAPI)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Patient:
      type: object
      properties:
        id:
          type: string
          example: "pat-001"
        full_name:
          type: string
          example: "Maria Rossi"
        date_of_birth:
          type: string
          format: date
          example: "1978-04-12"
        allergies:
          type: array
          items:
            type: string
          example: ["penicillin"]

    Case:
      type: object
      properties:
        id:
          type: string
          example: "case-001"
        patient_id:
          type: string
          example: "pat-001"
        surgery_type:
          type: string
          example: "knee replacement"
        status:
          type: string
          enum: [open, closed]
          example: "open"
        created_at:
          type: string
          format: date-time
          example: "2026-06-29T10:00:00Z"

    Medication:
      type: object
      properties:
        id:
          type: string
          example: "med-001"
        case_id:
          type: string
          example: "case-001"
        name:
          type: string
          example: "Ibuprofen"
        dose:
          type: string
          example: "400mg"
        frequency:
          type: string
          example: "3x daily"
        duration_days:
          type: integer
          example: 14
        notes:
          type: string
          example: "Take with food"

    DoseLog:
      type: object
      properties:
        id:
          type: string
          example: "log-001"
        reminder_id:
          type: string
          example: "rem-001"
        status:
          type: string
          enum: [taken, missed, skipped]
          example: "taken"
        logged_at:
          type: string
          format: date-time
          example: "2026-06-29T08:05:00Z"

    CheckIn:
      type: object
      properties:
        id:
          type: string
          example: "chk-001"
        case_id:
          type: string
          example: "case-001"
        mood:
          type: integer
          minimum: 1
          maximum: 4
          example: 3
        note:
          type: string
          example: "Feeling better than yesterday"
        created_at:
          type: string
          format: date-time
          example: "2026-06-29T09:00:00Z"

    Recommendation:
      type: object
      properties:
        id:
          type: string
          example: "rec-001"
        case_id:
          type: string
          example: "case-001"
        content:
          type: string
          example: "Avoid weight-bearing for 2 weeks. Ice the knee 3x daily."
        created_at:
          type: string
          format: date-time
          example: "2026-06-29T10:00:00Z"

security:
  - BearerAuth: []

paths:

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in as clinician or patient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "doctor@clinic.com"
                password:
                  type: string
                  example: "secret123"
      responses:
        '200':
          description: JWT token returned
          content:
            application/json:
              example:
                token: "eyJhbGciOiJIUzI1NiJ9.example"
                role: "clinician"
                user_id: "usr-001"

  /auth/dev-login:
    post:
      tags: [Auth]
      summary: Instant login for local development
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  example: "doctor@clinic.com"
                role:
                  type: string
                  enum: [clinician, patient]
                  example: "clinician"
      responses:
        '200':
          description: JWT token returned
          content:
            application/json:
              example:
                token: "eyJhbGciOiJIUzI1NiJ9.devtoken"
                role: "clinician"
                user_id: "usr-001"

  /patients:
    get:
      tags: [Patients]
      summary: List all patients for the logged-in clinician
      responses:
        '200':
          description: Array of patients
          content:
            application/json:
              example:
                - id: "pat-001"
                  full_name: "Maria Rossi"
                  date_of_birth: "1978-04-12"
                  allergies: ["penicillin"]
                - id: "pat-002"
                  full_name: "John Smith"
                  date_of_birth: "1965-09-30"
                  allergies: []
    post:
      tags: [Patients]
      summary: Create a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, date_of_birth]
              properties:
                full_name:
                  type: string
                  example: "Maria Rossi"
                date_of_birth:
                  type: string
                  example: "1978-04-12"
                allergies:
                  type: array
                  items:
                    type: string
                  example: ["penicillin"]
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              example:
                id: "pat-001"
                full_name: "Maria Rossi"
                date_of_birth: "1978-04-12"
                allergies: ["penicillin"]

  /patients/{patient_id}:
    get:
      tags: [Patients]
      summary: Get a single patient
      parameters:
        - name: patient_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Patient object
          content:
            application/json:
              example:
                id: "pat-001"
                full_name: "Maria Rossi"
                date_of_birth: "1978-04-12"
                allergies: ["penicillin"]

  /cases:
    get:
      tags: [Cases]
      summary: List all cases for the logged-in clinician
      responses:
        '200':
          description: Array of cases
          content:
            application/json:
              example:
                - id: "case-001"
                  patient_id: "pat-001"
                  surgery_type: "knee replacement"
                  status: "open"
                  created_at: "2026-06-29T10:00:00Z"
    post:
      tags: [Cases]
      summary: Create a case for a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, surgery_type]
              properties:
                patient_id:
                  type: string
                  example: "pat-001"
                surgery_type:
                  type: string
                  example: "knee replacement"
      responses:
        '201':
          description: Case created
          content:
            application/json:
              example:
                id: "case-001"
                patient_id: "pat-001"
                surgery_type: "knee replacement"
                status: "open"
                created_at: "2026-06-29T10:00:00Z"

  /cases/{case_id}:
    get:
      tags: [Cases]
      summary: Get a single case
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Case object
          content:
            application/json:
              example:
                id: "case-001"
                patient_id: "pat-001"
                surgery_type: "knee replacement"
                status: "open"
                created_at: "2026-06-29T10:00:00Z"
    patch:
      tags: [Cases]
      summary: Update a case status
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [open, closed]
                  example: "closed"
      responses:
        '200':
          description: Case updated
          content:
            application/json:
              example:
                id: "case-001"
                status: "closed"

  /cases/{case_id}/medications:
    get:
      tags: [Medications]
      summary: List all medications for a case
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of medications
          content:
            application/json:
              example:
                - id: "med-001"
                  name: "Ibuprofen"
                  dose: "400mg"
                  frequency: "3x daily"
                  duration_days: 14
                  notes: "Take with food"
    post:
      tags: [Medications]
      summary: Add a medication to a case
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, dose, frequency, duration_days]
              properties:
                name:
                  type: string
                  example: "Ibuprofen"
                dose:
                  type: string
                  example: "400mg"
                frequency:
                  type: string
                  example: "3x daily"
                duration_days:
                  type: integer
                  example: 14
                notes:
                  type: string
                  example: "Take with food"
      responses:
        '201':
          description: Medication added
          content:
            application/json:
              example:
                id: "med-001"
                case_id: "case-001"
                name: "Ibuprofen"
                dose: "400mg"
                frequency: "3x daily"
                duration_days: 14
                notes: "Take with food"

  /cases/{case_id}/reminders:
    get:
      tags: [Reminders]
      summary: Get scheduled reminders for a case
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of reminders
          content:
            application/json:
              example:
                - id: "rem-001"
                  medication_name: "Ibuprofen"
                  dose: "400mg"
                  scheduled_time: "08:00"
                  date: "2026-07-01"
                - id: "rem-002"
                  medication_name: "Ibuprofen"
                  dose: "400mg"
                  scheduled_time: "14:00"
                  date: "2026-07-01"

  /dose-logs:
    post:
      tags: [Dose Logs]
      summary: Log a dose as taken, missed, or skipped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reminder_id, status]
              properties:
                reminder_id:
                  type: string
                  example: "rem-001"
                status:
                  type: string
                  enum: [taken, missed, skipped]
                  example: "taken"
                logged_at:
                  type: string
                  format: date-time
                  example: "2026-06-29T08:05:00Z"
      responses:
        '201':
          description: Dose logged
          content:
            application/json:
              example:
                id: "log-001"
                reminder_id: "rem-001"
                status: "taken"
                logged_at: "2026-06-29T08:05:00Z"

  /cases/{case_id}/dose-logs:
    get:
      tags: [Dose Logs]
      summary: Get all dose logs for a case
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dose logs with adherence summary
          content:
            application/json:
              example:
                adherence_percent: 78
                logs:
                  - id: "log-001"
                    medication_name: "Ibuprofen"
                    scheduled_time: "08:00"
                    date: "2026-07-01"
                    status: "taken"
                    logged_at: "2026-07-01T08:05:00Z"
                  - id: "log-002"
                    medication_name: "Ibuprofen"
                    scheduled_time: "14:00"
                    date: "2026-07-01"
                    status: "missed"
                    logged_at: null

  /cases/{case_id}/recommendations:
    get:
      tags: [Recommendations]
      summary: Get recovery recommendations for a case
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of recommendations
          content:
            application/json:
              example:
                - id: "rec-001"
                  content: "Avoid weight-bearing for 2 weeks. Ice the knee 3x daily."
                  created_at: "2026-06-29T10:00:00Z"
    post:
      tags: [Recommendations]
      summary: Add a recovery recommendation
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  example: "Avoid weight-bearing for 2 weeks."
      responses:
        '201':
          description: Recommendation added
          content:
            application/json:
              example:
                id: "rec-001"
                case_id: "case-001"
                content: "Avoid weight-bearing for 2 weeks."
                created_at: "2026-06-29T10:00:00Z"

  /cases/{case_id}/check-ins:
    get:
      tags: [Check-ins]
      summary: Get check-in history for a case
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of check-ins
          content:
            application/json:
              example:
                - id: "chk-001"
                  mood: 3
                  note: "Feeling better than yesterday"
                  created_at: "2026-06-29T09:00:00Z"
                - id: "chk-002"
                  mood: 2
                  note: "Some pain in the morning"
                  created_at: "2026-06-28T09:00:00Z"

  /check-ins:
    post:
      tags: [Check-ins]
      summary: Patient submits a daily check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [case_id, mood]
              properties:
                case_id:
                  type: string
                  example: "case-001"
                mood:
                  type: integer
                  minimum: 1
                  maximum: 4
                  example: 3
                note:
                  type: string
                  example: "Feeling better than yesterday"
      responses:
        '201':
          description: Check-in saved
          content:
            application/json:
              example:
                id: "chk-001"
                mood: 3
                note: "Feeling better than yesterday"
                created_at: "2026-06-29T09:00:00Z"

  /cases/{case_id}/chat:
    get:
      tags: [AI]
      summary: Get chat history for a case
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of chat messages
          content:
            application/json:
              example:
                - id: "msg-001"
                  role: "user"
                  content: "Can I take ibuprofen with food?"
                  created_at: "2026-06-29T09:00:00Z"
                - id: "msg-002"
                  role: "assistant"
                  content: "Yes, your doctor recommends taking Ibuprofen with food."
                  created_at: "2026-06-29T09:00:01Z"

  /ai/chat:
    post:
      tags: [AI]
      summary: Send a message to the AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [case_id, message]
              properties:
                case_id:
                  type: string
                  example: "case-001"
                message:
                  type: string
                  example: "Can I take ibuprofen with food?"
      responses:
        '200':
          description: AI response
          content:
            application/json:
              example:
                reply: "Yes, your doctor recommends taking Ibuprofen with food to reduce stomach irritation."
                sources: ["case notes"]
                out_of_scope: false

  /fda/drug/{name}:
    get:
      tags: [FDA]
      summary: Get FDA safety info for a drug
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: "ibuprofen"
      responses:
        '200':
          description: FDA safety summary
          content:
            application/json:
              example:
                drug: "ibuprofen"
                warnings:
                  - "May increase risk of heart attack or stroke with long-term use"
                  - "Can cause stomach bleeding especially in people over 60"
                source: "openFDA"
                retrieved_at: "2026-06-29T10:00:00Z"